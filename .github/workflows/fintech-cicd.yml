
name: FinTech Complete CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  test:
    name: Python Testing

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Run Unit Tests
        working-directory: Day-11-CI-CD/Lab-09-FinTech-CI-CD
        run: python3 -m unittest -v

  docker-build:
    name: Docker Image Build

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t fintech-final:v1 \
            Day-11-CI-CD/Lab-09-FinTech-CI-CD

      - name: Verify Docker Image
        run: docker images
