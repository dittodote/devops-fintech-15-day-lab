name: FinTech Docker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t fintech-payment-ci:v1 \
            Day-11-CI-CD/Lab-05-Docker-CI

      - name: Verify Docker Image
        run: docker images
